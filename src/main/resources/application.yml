spring:
  application:
    name: kioskonube-despachos-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kioskonube}
    username: ${DB_USER:kioskoadmin}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: despachos   # schema propio de este microservicio
        hbm2ddl:
          create_namespaces: true

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 5
        default-requeue-rejected: false

server:
  port: 8084

# Nombres de mensajería centralizados
kioskonube:
  mensajeria:
    despachos:                    # lo que este servicio PUBLICA
      exchange: despachos.exchange
      routing-key: despacho.actualizado
    ordenes:                      # lo que este servicio CONSUME desde órdenes
      exchange: ordenes.exchange
      queue: despachos.ordenes.queue
      routing-key: orden.creada
    dead-letter:
      dlx-sufijo: .dlx
      dlq-sufijo: .dlq

  despachos:
    reintentos:
      max-intentos: 3
      espera-ms: 2000
